name: Linux C++ CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} && cmake --build build --parallel 2
      - name: CTest
        run: ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build (ASan + UBSan)
        env:
          CXX: g++
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DSTONEKV_ENABLE_SANITIZERS=ON && cmake --build build-asan --parallel 2
      - name: CTest (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure
  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build (TSan)
        env:
          CXX: g++
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DSTONEKV_ENABLE_TSAN=ON && cmake --build build-tsan --parallel 2
      - name: CTest (TSan)
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure
